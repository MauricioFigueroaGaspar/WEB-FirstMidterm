<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.google.com/specimen/Space+Mono" class="rel">
  <link rel="stylesheet" href="css/style.css">

  <title>Tip calculator app</title>

</head>
<body>

  Bill

  Select Tip %
  5%
  10%
  15%
  25%
  50%
  Custom

  Number of People

  Tip Amount
  / person

  Total
  / person

  Reset
  
  <h1>SPLITTER</h1>

  <div class="card shadow calculator-base">
    <div class="row justify-content-center p-3">
      
      <!-- Left side -->
      <div class="col-12 col-lg-6 p-5">
        <div class="row">
          <p>Bill</p>
          <input type="text">
        </div>
        <div class="row">
          <p>Select Tip %</p>
          <div class="row">
            <div class="col-4">
              <button>%</button>
            </div>
            <div class="col-4">
              <button>%</button>
            </div>
            <div class="col-4">
              <button>%</button>
            </div>
          </div>
          <div class="row">
            <div class="col-4">
              <button>%</button>
            </div>
            <div class="col-4">
              <button>%</button>
            </div>
            <div class="col-4">
              <button>%</button>
            </div>
          </div>
        </div>
        <div class="row">
          <p>Number of People</p>
          <input type="text" class="text">
        </div>
      </div>

      <!-- Right side -->
      <div class="col-12 col-lg-6 p-5 p-lg-4 right-side">
          <div>
           <div class="row">
             <div class="col">
               <p>Tip Amount</p>
               <p>/ person</p>
              </div>
              <div class="col">
                <h2>$0.00</h2>
              </div>
            </div>
            <div class="row">
              <div class="col">
                <p>Total</p>
                <p>/ person</p>
              </div>
              <div class="col">
                <h2>$0.00</h2>
              </div>
            </div>
            <div class="row">
              <input type="text">
            </div>
          </div>
        </div>

    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
