<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

  <title>Tip calculator app</title>

</head>
<body>

  <p style="color: hsl(183, 100%, 15%)">MWMWMWM</p>
  <p style="color: hsl(186, 14%, 43%)">MWMWMWM</p>
  <p style="color: hsl(184, 14%, 56%)">MWMWMWM</p>
  <p style="color: hsl(185, 41%, 84%)">MWMWMWM</p>
  <p style="color: hsl(189, 41%, 97%)">MWMWMWM</p>
  <p style="color: hsl(172, 67%, 45%)">MWMWMWM</p>
  
  <h1 class="title">S P L I<br>T T E R</h1>

  <div class="card shadow calculator-base">
    <div class="row justify-content-center p-3 mx-0">
      
      <!-- Left side -->
      <div class="col-12 col-lg-6 mt-3 mb-4">

        <div class="row mx-0 mb-3">
          <p class="data">Bill</p>
            <div class="input-container">
              <i><img src="images/icon-dollar.svg"></i>
              <input type="number" class="box">
            </div>
        </div>

        <div class="row mx-0 mb-3">
          <p class="data mt">Select Tip %</p>
          <div class="row row-cols-2 g-3 row-cols-lg-3">
            <div class="col p-0">
              <button class="btn tip-btn">5%</button>
            </div>
            <div class="col p-0">
              <button class="btn tip-btn">10%</button>
            </div>
            <div class="col p-0">
              <button class="btn tip-btn">15%</button>
            </div>
            <div class="col p-0">
              <button class="btn tip-btn">25%</button>
            </div>
            <div class="col p-0">
              <button class="btn tip-btn">50%</button>
            </div>
            <div class="col p-0">
              <input type="number" placeholder="Custom">
            </div>
          </div>
        </div>
        
        <div class="row mx-0 mb-3">
          <p class="data">Number of People</p>
            <div class="input-container">
              <i><img src="images/icon-person.svg"></i>
              <input type="text" class="box">
            </div>
        </div>
      </div>

      <!-- Right side -->
      <div class="col-12 col-lg-6 mb-2 py-5 px-4 p-lg-4 right-side">
          <div>
            <div class="row">
             <div class="col">
               <p class="info">Tip Amount</p>
               <p class="per-person">/ person</p>
              </div>
              <div class="col">
                <p class="price">$0.00</p>
              </div>
            </div>
            <div class="row">
              <div class="col">
                <p class="info">Total</p>
                <p class="per-person">/ person</p>
              </div>
              <div class="col">
                <p class="price">$0.00</p>
              </div>
            </div>
            <div class="row">
              <button =images/icon-person.svgclass="reset">RESET</button>
            </div>
          </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
